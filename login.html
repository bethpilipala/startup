<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/site.css" />
    <title>Login | The Partial Pantry</title>
</head>
<body>
    <header>
      <h1>The Partial Pantry</h1>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="recipes.html">Recipes</a></li>
          <li><a href="ingredients.html">Ingredients</a></li>
          <li><a href="login.html" aria-current="page">Login</a></li>
        </ul>
        <form class="site-recipe-search d-flex align-items-center gap-2 ms-auto" role="search" aria-label="Search recipes" action="/search" method="get">
          <label class="visually-hidden" for="login-site-recipe-search">Search recipes</label>
          <input class="form-control" id="login-site-recipe-search" name="q" type="search" placeholder="Find a recipe" />
          <button class="btn" type="submit">Search</button>
        </form>
      </nav>
      <hr />
    </header>

    <main>
        <form class="login-form" method="get" action="userhome.html">
          <div>
            <label for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" placeholder="your@email.com" autocomplete="username" />
          </div>
          <div>
            <label for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
            <a class="login-forgot-password" href="#">Forgot your password?</a>
          </div>
          <div class="login-actions">
            <button class="btn" type="submit">Log in</button>
            <button class="btn" type="submit">Create account</button>
          </div>
        </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Beth Perkins</span>
      <br />
      <a href="https://github.com/bethpilipala/startup" aria-label="The Partial Pantry on GitHub">GitHub</a>
    </footer>
    
</body>
</html>
